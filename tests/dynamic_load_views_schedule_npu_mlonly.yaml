# dynamic_load_views_schedule_npu_mlonly.yaml
#
# 3-phase schedule for Adaptive hot-swap and Stop-and-restart.
# 1 deployment change: yolov3_small → NPU1 (suboptimal, stays there).

phase_a:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 0.5
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 0.5
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 3
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 2
    model: resnet50_small

phase_b:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 8
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 6
    model: resnet50_small

phase_c:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: yolov3_big
  yolov3_small_npu1:
    display: view2
    execution: npu1
    infps: 8
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 6
    model: resnet50_small
