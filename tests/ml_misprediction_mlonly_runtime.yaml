# ml_misprediction_mlonly_runtime.yaml
#
# Single-combination runtime schedule used by
# scripts/ml_misprediction_validation.py for the
# "Adaptive (ML-only)" run in results/ml_misprediction_fallback.pdf.
#
# The system runs the predicted CPU placement at the same per-view
# input rates the BoundGuard run uses for its first phase. There is
# no fallback combo to transition to, so the executor stays in this
# single combo for the entire run -- which is exactly what "ML-only"
# means: the predictor's choice is committed without any feedback
# loop on top of it.
#
# View models match the bounded-recovery and dynamic-load YAMLs so
# the V(t) metric is calibrated identically across figures.

combination_overload:
  mnasnet_cpu:
    display: view1
    execution: cpu
    infps: 400
    model: mnasnet
  resnet50_cpu:
    display: view2
    execution: cpu
    infps: 60
    model: resnet50
  resnext50_cpu:
    display: view3
    execution: cpu
    infps: 60
    model: resnext50
  yolov4_cpu:
    display: view4
    execution: cpu
    infps: 10
    model: yolov4
