# dynamic_load_views_schedule.yaml
#
# Three-phase scenario + BoundGuard candidate cycle for the dynamic-load
# adaptation figures (results/dynamic_load_adaptation_epsilon_<eps>.pdf).
#
# Phase A (combination_p1_low):    stable, all CPU, V(t) ~ 0
# Phase B (combination_p1_high):   load jumps, same P1 placement, V(t) climbs
# BoundGuard probing (cand_1..cand_3): progressively offload to GPU,
#                                      T_v = 3 s each
# Final (combination_p2_high):     all GPU; BoundGuard commits here for the
#                                  tail after the candidate cycle completes
#
# Combination order is significant: the executor iterates combos in YAML
# insertion order. BoundGuard runs the full sequence; Static (mode 3)
# only schedules p1_low + p1_high and leaves the later entries unused.

combination_p1_low:
  mnasnet_cpu:
    display: view1
    execution: cpu
    infps: 2
    model: mnasnet
  resnet50_cpu:
    display: view2
    execution: cpu
    infps: 2
    model: resnet50
  resnext50_cpu:
    display: view3
    execution: cpu
    infps: 2
    model: resnext50
  yolov4_cpu:
    display: view4
    execution: cpu
    infps: 0.3
    model: yolov4

combination_p1_high:
  mnasnet_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: mnasnet
  resnet50_cpu:
    display: view2
    execution: cpu
    infps: 8
    model: resnet50
  resnext50_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnext50
  yolov4_cpu:
    display: view4
    execution: cpu
    infps: 1.2
    model: yolov4

combination_cand_1:
  mnasnet_gpu:
    display: view1
    execution: gpu
    infps: 8
    model: mnasnet
  resnet50_cpu:
    display: view2
    execution: cpu
    infps: 8
    model: resnet50
  resnext50_cpu:
    display: view3
