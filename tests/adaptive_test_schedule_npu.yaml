# adaptive_test_schedule_npu.yaml
# NPU port of tests/adaptive_test_schedule.yaml.
#
# Test schedule for adaptive deploy comparison: 3 models, 2 combinations.
# combo_A: all CPU  ->  combo_B: heaviest 2 moved to npu0 / npu1.

combo_A:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 30
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 30
    model: yolov3_small
  resnet50_small_cpu:
    display: view3
    execution: cpu
    infps: 10
    model: resnet50_small

combo_B:
  yolov3_big_npu0:
    display: view1
    execution: npu0
    infps: 30
    model: yolov3_big
  yolov3_small_npu1:
    display: view2
    execution: npu1
    infps: 30
    model: yolov3_small
  resnet50_small_cpu:
    display: view3
    execution: cpu
    infps: 10
    model: resnet50_small
