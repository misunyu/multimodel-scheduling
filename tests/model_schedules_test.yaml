# model_schedules_test.yaml
# Test schedule for adaptive/reactive deploy comparison
# 4 models: mnasnet, resnet50, resnext50, squeezenet1.0-12
#
# combination_1: GOOD deployment (resnet50, resnext50 on GPU)
# combination_2: WORSE deployment (same models, all CPU)
#
# Transition: combination_1 → combination_2 degrades performance.
# Mode 2 (reactive) should detect the degradation and rollback to combination_1.

# Available devices:
# - CPU: 1
# - GPU: 1 (IDs: 0)

