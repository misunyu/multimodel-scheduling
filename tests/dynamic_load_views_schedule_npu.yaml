# dynamic_load_views_schedule_npu.yaml
#
# Four-phase NPU scenario for dynamic_load_adaptation_antara.pdf
#
# phase_a: low load, all CPU, V(t) ~ 0
# phase_b: overload, all CPU, V(t) >> epsilon
# phase_c: 1st deployment change (suboptimal) — yolov3_small → NPU1 only.
#          yolov3_big (main bottleneck) stays on CPU → V(t) stays > epsilon.
# phase_d: 2nd deployment change (BoundGuard fallback) — yolov3_big → NPU0.
#          yolov3_small stays on NPU1 (no model switch). V(t) drops < epsilon.

phase_a:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 0.5
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 0.5
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 3
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 2
    model: resnet50_small

phase_b:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 8
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 6
    model: resnet50_small

phase_c:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: yolov3_big
  yolov3_small_npu1:
    display: view2
    execution: npu1
    infps: 8
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 6
    model: resnet50_small

phase_d:
  # infps chosen to match today's NPU service rate for yolov3 on NPU
  # (~0.87 fps for NPU0; NPU1 yields 0 fps so view2 is excluded from V(t)).
  # Keeping infps near device capacity prevents runaway queue build-up that
  # would otherwise keep V(t) above epsilon even after the correct placement.
  yolov3_big_npu0:
    display: view1
    execution: npu0
    infps: 1
    model: yolov3_big
  yolov3_small_npu1:
    display: view2
    execution: npu1
    infps: 1
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 8
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 6
    model: resnet50_small
