# dynamic_load_views_schedule_npu.yaml
#
# Four-model NPU scenario for the dynamic_load_adaptation figure.
#
# Narrative (matches the paper figure, YOLO CPU->NPU direction):
#   phase_a — baseline. YOLOs on CPU, ResNets on NPU0/NPU1. Input
#             rates tiny. V(t) ~ 0.
#   phase_b — load change. SAME placement. YOLO input rate jumps from
#             3 fps to 8 fps. The CPU cannot sustain YOLOv3 at 8 fps
#             (CPU cap ~5.7 fps for yolov3_big, ~7.4 for yolov3_small),
#             so queues build up; end-to-end latency climbs well above
#             the SLO (1000/8 = 125 ms) and V(t) crosses epsilon.
#   phase_c — reconfiguration. YOLOs move to NPU0/NPU1 (fits 8 fps
#             cleanly, NPU yolov3 infer is ~77/48 ms), ResNets move to
#             CPU where at infps=3 they are no burden. V(t) falls
#             below epsilon for BoundGuard and the rebuilt Stop-and-
#             restart workers. Static keeps the overloaded phase_a
#             placement and stays above epsilon.

phase_a:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 3
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 3
    model: yolov3_small
  resnet50_big_npu0:
    display: view3
    execution: npu0
    infps: 3
    model: resnet50_big
  resnet50_small_npu1:
    display: view4
    execution: npu1
    infps: 3
    model: resnet50_small

phase_b:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 8
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 8
    model: yolov3_small
  resnet50_big_npu0:
    display: view3
    execution: npu0
    infps: 3
    model: resnet50_big
  resnet50_small_npu1:
    display: view4
    execution: npu1
    infps: 3
    model: resnet50_small

phase_c:
  yolov3_big_npu0:
    display: view1
    execution: npu0
    infps: 8
    model: yolov3_big
  yolov3_small_npu1:
    display: view2
    execution: npu1
    infps: 8
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 3
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 3
    model: resnet50_small
