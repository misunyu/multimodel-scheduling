# steady_state_views_schedule_npu.yaml
#
# Single-combination "stable workload" schedule for NPU environment.
# Used by scripts/runtime_overhead_analysis_antara.py to compare the
# steady-state overhead of three execution modes.
#
# All models on CPU at low input rates so V(t) ~ 0.
# Same models as the dynamic load NPU experiment.

combination_stable:
  yolov3_big_cpu:
    display: view1
    execution: cpu
    infps: 0.5
    model: yolov3_big
  yolov3_small_cpu:
    display: view2
    execution: cpu
    infps: 0.5
    model: yolov3_small
  resnet50_big_cpu:
    display: view3
    execution: cpu
    infps: 3
    model: resnet50_big
  resnet50_small_cpu:
    display: view4
    execution: cpu
    infps: 2
    model: resnet50_small
