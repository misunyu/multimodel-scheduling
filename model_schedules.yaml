# ACCV 2026 schedule configurations.
# Models are YOLOv8 (Mobilint .mxq on NPU, Ultralytics-exported ONNX on CPU/GPU)
# + ResNet50 (Mobilint .mxq on NPU, torchvision-exported ONNX on CPU/GPU).
#
# Each combination is a dict of <id>: { model, execution, display, infps }.
# execution ∈ {cpu, gpu, npu, npu0, npu1}.
# display: view1..view4 (visible) or "none" (headless).

# All three devices running YOLOv8n in parallel — quickest sanity test
# for cpu+gpu+npu coexistence. Each stream pulls frames at 30 FPS.
combination_cpu_gpu_npu:
  yolov8n_cpu:
    model: yolov8n
    execution: cpu
    display: view1
    infps: 30
  yolov8n_gpu:
    model: yolov8n
    execution: gpu
    display: view2
    infps: 30
  yolov8n_npu:
    model: yolov8n
    execution: npu
    display: view3
    infps: 30

# Heterogeneous placement: scale up CPU/GPU models while keeping NPU light.
combination_mixed_models:
  yolov8s_cpu:
    model: yolov8s
    execution: cpu
    display: view1
    infps: 15
  yolov8m_gpu:
    model: yolov8m
    execution: gpu
    display: view2
    infps: 30
  yolov8n_npu:
    model: yolov8n
    execution: npu
    display: view3
    infps: 30
  resnet50_npu:
    model: resnet50
    execution: npu
    display: none
    infps: 60

# NPU-only baseline (everything on Mobilint Aries).
combination_all_npu:
  yolov8n_npu:
    model: yolov8n
    execution: npu
    display: view1
    infps: 30
  yolov8s_npu:
    model: yolov8s
    execution: npu
    display: view2
    infps: 30
  resnet50_npu:
    model: resnet50
    execution: npu
    display: view3
    infps: 60

# CPU-only baseline.
combination_all_cpu:
  yolov8n_cpu:
    model: yolov8n
    execution: cpu
    display: view1
    infps: 10
  resnet50_cpu:
    model: resnet50
    execution: cpu
    display: view2
    infps: 30

# GPU-only baseline.
combination_all_gpu:
  yolov8n_gpu:
    model: yolov8n
    execution: gpu
    display: view1
    infps: 30
  yolov8s_gpu:
    model: yolov8s
    execution: gpu
    display: view2
    infps: 30
  resnet50_gpu:
    model: resnet50
    execution: gpu
    display: view3
    infps: 60
